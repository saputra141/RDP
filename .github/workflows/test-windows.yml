name: Test Windows RDP

on:
  workflow_dispatch:

jobs:
  test-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "Windows Runner ready"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

      - name: Set up RDP Password
        shell: powershell
        run: |
          # Mengatur password untuk user default GitHub Actions (runneradmin)
          net user runneradmin "WindowsRDP2026!"
          # Mengaktifkan akses RDP di Firewall dan Registry
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Download Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $url -OutFile tailscale.exe
          if (!(Test-Path tailscale.exe)) { throw "Download failed" }

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath .\tailscale.exe -ArgumentList "/quiet", "/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation failed" }

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "GitHub Secret TAILSCALE_AUTH_KEY is missing"
          }
          
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (!(Test-Path $ts)) { throw "Tailscale executable not found" }
          
          & $ts up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed" }
          
          Write-Host "Tailscale connected"
          & $ts ip -4

      - name: Check RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-Service TermService
          
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "RDP siap digunakan! Runner akan tetap berjalan agar Anda bisa login..."
          # Menunda proses selesai agar RDP tetap hidup selama ~5.8 jam (21000 detik)
          Start-Sleep -Seconds 21000
