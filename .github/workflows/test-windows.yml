
name: Test Windows RDP

on:
  workflow_dispatch:

jobs:
  test-rdp:
    runs-on: windows-latest
    timeout-minutes: 100

    steps:
      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "Windows runner ready"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

      - name: Download Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:RUNNER_TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer
          if (!(Test-Path $installer)) { throw "Download failed" }

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\tailscale.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation failed" }

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "GitHub Secret TAILSCALE_AUTH_KEY is missing"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (!(Test-Path $ts)) { throw "Tailscale executable not found" }

          & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=gh-runner-$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed" }

          Write-Host "Tailscale connected"
          & $ts ip -4

      - name: Check RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-Service TermService
          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          Write-Host "RDP check complete"
